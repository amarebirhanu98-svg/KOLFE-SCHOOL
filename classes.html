<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classes | A.Kolfe Secondary School</title>

    <link
        rel="stylesheet"
        href="css/classes.css"
    >
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            KSS
        </div>

        <div>
            <strong>A.KOLFE</strong>
            <small>SECONDARY SCHOOL</small>
        </div>

    </div>

    <div class="admin">

        <div class="avatar">
            AB
        </div>

        <div>
            <strong>AMARE BIRHANU</strong>
            <small>Administrator</small>
        </div>

    </div>

</header>


<main class="container">

    <div class="page-header">

        <div>
            <h1>Classes & Sections</h1>

            <p>
                Manage grades, sections and class information
            </p>
        </div>

        <button
            class="primary-btn"
            id="addClassBtn"
        >
            + Add Class
        </button>

    </div>


    <!-- SUMMARY -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                🏫
            </div>

            <div>
                <small>Total Classes</small>
                <strong id="totalClasses">0</strong>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                9️⃣
            </div>

            <div>
                <small>Grade 9</small>
                <strong id="grade9">0</strong>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🔟
            </div>

            <div>
                <small>Grade 10</small>
                <strong id="grade10">0</strong>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🎓
            </div>

            <div>
                <small>Grade 11–12</small>
                <strong id="grade1112">0</strong>
            </div>

        </div>

    </section>


    <!-- FILTER -->

    <section class="filter-card">

        <input
            type="search"
            id="searchInput"
            placeholder="Search class or teacher..."
        >

        <select id="gradeFilter">

            <option value="All">
                All Grades
            </option>

            <option value="Grade 9">
                Grade 9
            </option>

            <option value="Grade 10">
                Grade 10
            </option>

            <option value="Grade 11">
                Grade 11
            </option>

            <option value="Grade 12">
                Grade 12
            </option>

        </select>

    </section>


    <!-- CLASS LIST -->

    <section class="class-grid" id="classGrid">
    </section>

</main>


<!-- ADD CLASS MODAL -->

<div
    class="modal"
    id="classModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div>

                <h2 id="modalTitle">
                    Add Class
                </h2>

                <p>
                    Enter class information
                </p>

            </div>

            <button
                class="close-btn"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <form id="classForm">

            <input
                type="hidden"
                id="editId"
            >


            <div class="form-group">

                <label>Grade</label>

                <select
                    id="grade"
                    required
                >

                    <option value="">
                        Select grade
                    </option>

                    <option value="Grade 9">
                        Grade 9
                    </option>

                    <option value="Grade 10">
                        Grade 10
                    </option>

                    <option value="Grade 11">
                        Grade 11
                    </option>

                    <option value="Grade 12">
                        Grade 12
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Section</label>

                <input
                    type="text"
                    id="section"
                    placeholder="Example: 9-2"
                    required
                >

            </div>


            <div class="form-group">

                <label>Class Teacher</label>

                <input
                    type="text"
                    id="teacher"
                    placeholder="Teacher name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Room</label>

                <input
                    type="text"
                    id="room"
                    placeholder="Example: Room 12"
                    required
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Class
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/classes.js"></script>

<script src="js/auth-guard.js"></script>
<script src="js/logout.js"></script>
</body>

</html>
