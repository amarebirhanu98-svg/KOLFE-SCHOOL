<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Parents | A.Kolfe Secondary School
    </title>

    <link
        rel="stylesheet"
        href="css/parents.css"
    >
</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="logo">
            KSS
        </div>

        <div class="brand-text">

            <strong>
                A.KOLFE
            </strong>

            <small>
                SECONDARY SCHOOL
            </small>

        </div>

    </div>


    <div class="admin">

        <div class="avatar">
            AB
        </div>

        <div class="admin-text">

            <strong>
                AMARE BIRHANU
            </strong>

            <small>
                Administrator
            </small>

        </div>

    </div>

</header>



<main class="container">


    <!-- PAGE HEADER -->

    <section class="page-header">

        <div>

            <h1>
                Parents
            </h1>

            <p>
                Manage student parents and guardians
            </p>

        </div>


        <button
            type="button"
            class="primary-btn"
            id="addParentBtn"
        >
            + Add Parent
        </button>

    </section>



    <!-- STATISTICS -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                👨‍👩‍👧
            </div>

            <div>

                <small>
                    Total Parents
                </small>

                <strong id="totalParents">
                    0
                </strong>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👨
            </div>

            <div>

                <small>
                    Fathers
                </small>

                <strong id="totalFathers">
                    0
                </strong>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👩
            </div>

            <div>

                <small>
                    Mothers
                </small>

                <strong id="totalMothers">
                    0
                </strong>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📱
            </div>

            <div>

                <small>
                    Phone Contacts
                </small>

                <strong id="totalContacts">
                    0
                </strong>

            </div>

        </div>


    </section>



    <!-- SEARCH -->

    <section class="filter-card">

        <input
            type="search"
            id="searchInput"
            placeholder="Search parent, student or phone..."
        >


        <select id="relationshipFilter">

            <option value="All">
                All Relationships
            </option>

            <option value="Father">
                Father
            </option>

            <option value="Mother">
                Mother
            </option>

            <option value="Guardian">
                Guardian
            </option>

        </select>


    </section>



    <!-- PARENTS -->

    <section
        class="parent-grid"
        id="parentGrid"
    >

    </section>


</main>



<!-- ==========================================
     ADD / EDIT MODAL
========================================== -->

<div
    class="modal"
    id="parentModal"
>

    <div class="modal-box">


        <div class="modal-header">

            <div>

                <h2 id="modalTitle">
                    Add Parent
                </h2>

                <p>
                    Enter parent or guardian information
                </p>

            </div>


            <button
                type="button"
                class="close-btn"
                id="closeModal"
            >
                ×
            </button>

        </div>



        <form id="parentForm">


            <input
                type="hidden"
                id="editId"
            >


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="parentName"
                    placeholder="Example: Abebe Kebede"
                    required
                >

            </div>



            <div class="form-row">


                <div class="form-group">

                    <label>
                        Relationship
                    </label>

                    <select
                        id="relationship"
                        required
                    >

                        <option value="">
                            Select relationship
                        </option>

                        <option value="Father">
                            Father
                        </option>

                        <option value="Mother">
                            Mother
                        </option>

                        <option value="Guardian">
                            Guardian
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="09XXXXXXXX"
                        required
                    >

                </div>

            </div>



            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Example: Hana Abebe"
                    required
                >

            </div>



            <div class="form-row">


                <div class="form-group">

                    <label>
                        Student Grade
                    </label>

                    <select
                        id="studentGrade"
                        required
                    >

                        <option value="">
                            Select grade
                        </option>

                        <option value="Grade 9">
                            Grade 9
                        </option>

                        <option value="Grade 10">
                            Grade 10
                        </option>

                        <option value="Grade 11">
                            Grade 11
                        </option>

                        <option value="Grade 12">
                            Grade 12
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Student Class
                    </label>

                    <select
                        id="studentClass"
                        required
                    >

                        <option value="">
                            Select class
                        </option>

                        <option value="Class 1">
                            Class 1
                        </option>

                        <option value="Class 2">
                            Class 2
                        </option>

                        <option value="Class 3">
                            Class 3
                        </option>

                        <option value="Class 4">
                            Class 4
                        </option>

                        <option value="Class 5">
                            Class 5
                        </option>

                    </select>

                </div>

            </div>



            <div class="form-group">

                <label>
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Home address"
                    required
                >

            </div>



            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelBtn"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Parent
                </button>

            </div>


        </form>

    </div>

</div>



<script src="js/parents.js"></script>

<script src="js/auth-guard.js"></script>
<script src="js/logout.js"></script>
</body>

</html>
